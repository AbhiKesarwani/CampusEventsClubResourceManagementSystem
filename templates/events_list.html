{% extends 'layout.html' %}
{% block content %}

<h2 class="page-title text-center">Events</h2>

<!-- Add Event Button -->
<div class="flex justify-end mb-8">
    <a href="/events/create"
       class="btn-primary px-5 py-3 shadow-md hover:shadow-xl transition-all rounded-xl">
        + Create Event
    </a>
</div>

<!-- Events Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-10">

    {% for e in events %}

    <div class="bg-brand-surface border border-white/5 backdrop-blur-md soft-shadow-lg rounded-2xl overflow-hidden
                hover:scale-[1.03] hover:shadow-2xl transition-all duration-300 cursor-pointer">

        <!-- Event Image -->
        {% if e.first_image %}
        <img src="/static/{{ e.first_image }}"
             class="rounded-t-2xl h-52 w-full object-cover transition-all hover:brightness-90">
        {% else %}
        <div class="h-52 w-full bg-gradient-to-br from-gray-200 to-gray-300
                    flex items-center justify-center text-gray-500 font-medium">
            No Image
        </div>
        {% endif %}

        <!-- Card Content -->
        <div class="p-6">

            <!-- Title -->
            <h3 class="card-title leading-tight">{{ e.title }}</h3>
            <p class="card-sub mt-1">{{ e.club_name }}</p>

            <!-- Details -->
            <div class="mt-4 space-y-1 text-gray-600 text-sm">
                <p><b class="font-medium text-white">Date:</b> {{ e.date }}</p>
                <p><b class="font-medium text-white">Venue:</b> {{ e.venue_name }}</p>
            </div>

            <!-- Buttons -->
            <div class="flex gap-3 mt-6">

                <!-- View -->
                <a href="/events/{{ e.event_id }}"
                   class="btn-primary px-4 py-2 text-sm rounded-xl shadow-sm hover:shadow-lg">
                   View
                </a>

                <!-- Edit -->
                <a href="/events/{{ e.event_id }}/edit"
                   class="px-4 py-2 rounded-xl bg-yellow-500 text-white hover:bg-yellow-600 text-sm shadow">
                   Edit
                </a>

                <!-- Delete -->
                <form method="POST" action="/events/{{ e.event_id }}/delete"
                      onsubmit="return confirm('Delete this event?');">
                    <button class="btn-danger text-sm px-4 py-2 rounded-xl shadow">
                        Delete
                    </button>
                </form>

            </div>

        </div>
    </div>

    {% endfor %}

</div>

{% endblock %}
