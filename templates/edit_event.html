{% extends 'layout.html' %}
{% block content %}

<h2 class="page-title text-center mb-8">Edit Event</h2>

<div class="glass p-8 rounded-2xl max-w-5xl mx-auto soft-shadow-lg">

    <!-- ===== EVENT EDIT FORM ===== -->
    <form method="POST" enctype="multipart/form-data" class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- Left Column -->
        <div class="space-y-4">

            <!-- Club -->
            <div>
                <label class="font-semibold text-gray-700">Select Club</label>
                <select name="club_id" class="input-box">
                    {% for c in clubs %}
                    <option value="{{ c.club_id }}"
                            {% if c.club_id == event.club_id %}selected{% endif %}>
                        {{ c.club_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Title -->
            <div>
                <label class="font-semibold text-gray-700">Event Title</label>
                <input name="title" value="{{ event.title }}" class="input-box">
            </div>

            <!-- Lead -->
            <div>
                <label class="font-semibold text-gray-700">Event Lead</label>
                <input name="event_lead" value="{{ event.event_lead }}" class="input-box">
            </div>

            <!-- Contact -->
            <div>
                <label class="font-semibold text-gray-700">Contact</label>
                <input name="contact_no" value="{{ event.contact_no }}" class="input-box">
            </div>
        </div>

        <!-- Right Column -->
        <div class="space-y-4">

            <!-- Venue -->
            <div>
                <label class="font-semibold text-gray-700">Venue</label>
                <select name="venue_id" class="input-box">
                    {% for v in venues %}
                    <option value="{{ v.venue_id }}"
                            {% if v.venue_id == event.venue_id %}selected{% endif %}>
                        {{ v.venue_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Date -->
            <div>
                <label class="font-semibold text-gray-700">Date</label>
                <input type="date" name="date" value="{{ event.date }}" class="input-box">
            </div>

            <!-- Time -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="font-semibold text-gray-700">Start Time</label>
                    <input type="time" name="start_time" value="{{ event.start_time }}" class="input-box">
                </div>
                <div>
                    <label class="font-semibold text-gray-700">End Time</label>
                    <input type="time" name="end_time" value="{{ event.end_time }}" class="input-box">
                </div>
            </div>

            <!-- Registration Link -->
            <div>
                <label class="font-semibold text-gray-700">Google Form Link</label>
                <input name="registration_link" value="{{ event.registration_link }}" class="input-box">
            </div>
        </div>

        <!-- Description (full width) -->
        <div class="md:col-span-2">
            <label class="font-semibold text-gray-700">Description</label>
            <textarea name="description" class="input-box h-32">{{ event.description }}</textarea>
        </div>

        <!-- Upload New Images -->
        <div class="md:col-span-2">
            <label class="font-semibold text-gray-700">Upload More Images</label>
            <input type="file" name="event_images" multiple accept="image/*" class="input-box bg-white">
            <p class="text-xs text-gray-500 mt-1">You may upload multiple images.</p>
        </div>

        <!-- Submit -->
        <div class="md:col-span-2 mt-4">
            <button class="btn-primary w-full">Save Changes</button>
        </div>

    </form>

    <!-- ===== EXISTING IMAGE GALLERY ===== -->

    <h3 class="text-2xl font-bold text-blue-700 mt-10 mb-4">Event Images</h3>

    {% if event_images %}
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">

        {% for img in event_images %}
        <div class="relative group rounded-xl overflow-hidden soft-shadow">

            <!-- Image -->
            <img src="/static/{{ img.img_path }}"
                 onclick="openImageModal('/static/{{ img.img_path }}')"
                 class="h-40 w-full object-cover cursor-pointer group-hover:scale-105 transition" />

            <!-- Delete Button -->
            <form method="POST"
                  action="/events/{{ event.event_id }}/delete_image/{{ img.img_id }}"
                  class="absolute top-2 right-2"
                  onsubmit="return confirm('Delete this image?');">
                <button class="bg-red-600 text-white text-xs px-2 py-1 rounded-lg opacity-80 hover:opacity-100">
                    Delete
                </button>
            </form>

        </div>
        {% endfor %}

    </div>
    {% else %}
    <p class="text-gray-500">No images uploaded yet.</p>
    {% endif %}

</div>

<!-- ===== IMAGE MODAL ===== -->
<div id="imageModal"
     class="fixed inset-0 bg-black/80 hidden z-50 flex justify-center items-center backdrop-blur">

    <img id="modalImage" class="max-w-[85%] max-h-[85%] rounded-2xl border border-white/20">

    <button onclick="closeImageModal()"
            class="absolute top-6 right-6 text-white text-3xl font-bold hover:text-gray-300">
        ✕
    </button>
</div>

<script>
    function openImageModal(src) {
        document.getElementById("modalImage").src = src;
        document.getElementById("imageModal").classList.remove("hidden");
    }
    function closeImageModal() {
        document.getElementById("imageModal").classList.add("hidden");
    }
</script>

{% endblock %}
