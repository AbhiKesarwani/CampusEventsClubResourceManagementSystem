<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title or "CECRMS" }}</title>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Flowbite CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" />

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background: #eef2f7;
            font-family: "Inter", sans-serif;
        }

        /* Sidebar link beautification */
        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            color: #4b5563;
            font-weight: 500;
            transition: 0.25s;
        }
        .sidebar-link:hover {
            background: rgba(59,130,246,0.1);
            color: #1d4ed8;
        }
        .active-sidebar {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white !important;
            box-shadow: 0 5px 20px rgba(59,130,246,0.35);
        }

        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
        }
    </style>
</head>

<!-- THE FIX → remove overflow-hidden -->
<body class="min-h-screen flex bg-gray-100">

<!-- SIDEBAR -->
<aside id="sidebar"
       class="fixed top-0 left-0 h-full w-64 glass border-r border-white/30 shadow-xl
              transition-transform duration-300 -translate-x-full md:translate-x-0 z-50 overflow-y-auto">

    <div class="p-6">
        <h2 class="text-2xl font-extrabold bg-gradient-to-r from-blue-500 to-purple-600 text-transparent bg-clip-text">
            CECRMS
        </h2>
    </div>

    <nav class="mt-4 px-4 space-y-2 pb-10">

        <a href="/" class="sidebar-link {% if active=='dashboard' %}active-sidebar{% endif %}">
            <i data-lucide="layout-dashboard" class="w-6"></i>
            <span>Dashboard</span>
        </a>

        <a href="/events" class="sidebar-link {% if active=='events' %}active-sidebar{% endif %}">
            <i data-lucide="calendar-days" class="w-6"></i>
            <span>Events</span>
        </a>

        <a href="/clubs" class="sidebar-link {% if active=='clubs' %}active-sidebar{% endif %}">
            <i data-lucide="users" class="w-6"></i>
            <span>Clubs</span>
        </a>

        <a href="/venues" class="sidebar-link {% if active=='venues' %}active-sidebar{% endif %}">
            <i data-lucide="building" class="w-6"></i>
            <span>Venues</span>
        </a>

        <a href="/resources" class="sidebar-link {% if active=='resources' %}active-sidebar{% endif %}">
            <i data-lucide="package" class="w-6"></i>
            <span>Resources</span>
        </a>

        <a href="/recommendations" class="sidebar-link {% if active=='recommendations' %}active-sidebar{% endif %}">
            <i data-lucide="sparkles" class="w-6"></i>
            <span>Recommendations</span>
        </a>

        <a href="/logout" class="sidebar-link text-red-500">
            <i data-lucide="log-out" class="w-6"></i>
            <span>Logout</span>
        </a>

    </nav>
</aside>

<!-- MOBILE MENU BUTTON -->
<button onclick="toggleSidebar()"
        class="md:hidden fixed top-4 left-4 bg-blue-600 text-white p-2 rounded-lg shadow-lg z-50">
    <i data-lucide="menu"></i>
</button>

<script>
    function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        sidebar.classList.toggle("-translate-x-full");
    }
</script>

<!-- MAIN CONTENT -->
<div class="flex-1 md:ml-64 flex flex-col min-h-screen">

    <!-- Sticky Top Bar -->
    <header class="glass shadow-sm p-5 flex justify-between items-center sticky top-0 z-30">
        <h2 class="text-3xl font-bold text-gray-700 tracking-tight">
            {{ title or "Dashboard" }}
        </h2>

        <div class="flex items-center gap-3">
            <span class="font-medium text-gray-700">{{ user.name if user else "User" }}</span>
            <i data-lucide="user-circle" class="w-9 h-9 text-blue-600"></i>
        </div>
    </header>

    <!-- Scrollable Page Content -->
    <main class="p-6 overflow-y-auto flex-1">
        {% block content %}{% endblock %}
    </main>

</div>

<!-- Flowbite -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>

<script>
    lucide.createIcons();
</script>

</body>
</html>
