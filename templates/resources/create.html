{% extends 'layout.html' %}
{% block title %}Add Resource — CECRMS{% endblock %}
{% block page_title %}Add Resource{% endblock %}

{% block content %}
<div class="page-content anim-fade" style="max-width:640px;">

    <a href="{{ url_for('resources.list_resources') }}"
       class="inline-flex items-center gap-2 text-sm mb-6 hover-text-primary transition-colors"
       style="color:var(--text-muted);">
        <i data-lucide="arrow-left" style="width:13px;height:13px;"></i>
        Back to Resources
    </a>

    <div class="card p-6">
        <h1 class="page-title mb-5" style="display:flex;align-items:center;gap:8px;">
            <i data-lucide="plus-square" style="width:18px;height:18px;color:var(--emerald);"></i>
            New Resource
        </h1>

        <form method="POST">
            <div class="form-group">
                <label class="form-label">Resource Name <span style="color:var(--red);">*</span></label>
                <input name="resource_name" required placeholder="e.g. Projector, Microphone"
                       class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label">Total Quantity <span style="color:var(--red);">*</span></label>
                <input type="number" name="total_quantity" min="1" required placeholder="10"
                       class="form-input">
                <p class="form-hint">Total units available for allocation across all events.</p>
            </div>

            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea name="description" rows="3" placeholder="Optional description…"
                          class="form-input"></textarea>
            </div>

            <div class="flex gap-3">
                <button type="submit" class="btn btn-primary flex-1 justify-center">
                    <i data-lucide="plus" style="width:14px;height:14px;"></i>
                    Add Resource
                </button>
                <a href="{{ url_for('resources.list_resources') }}" class="btn btn-secondary">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
