{% extends 'layout.html' %}
{% block title %}Edit Resource — CECRMS{% endblock %}
{% block page_title %}Edit Resource{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto">
    <nav class="text-sm text-gray-500 mb-6 flex items-center gap-2">
        <a href="{{ url_for('resources.list_resources') }}" class="hover:text-emerald-500">Resources</a>
        <i data-lucide="chevron-right" class="w-4 h-4"></i>
        <span class="text-gray-100">Edit</span>
    </nav>
    <div class="bg-brand-surface border border-white/5 backdrop-blur-md rounded-2xl p-8 shadow-lg">
        <h2 class="text-xl font-bold text-white mb-6">Edit Resource</h2>
        <form method="POST" class="space-y-5">
            <div class="space-y-1.5">
                <label class="block text-sm font-semibold text-gray-600">Resource Name</label>
                <input name="resource_name" value="{{ resource.resource_name }}"
                       class="w-full rounded-xl border border-brand-border px-4 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none bg-brand-surface text-white">
            </div>
            <div class="space-y-1.5">
                <label class="block text-sm font-semibold text-gray-600">Total Quantity</label>
                <input type="number" name="total_quantity" value="{{ resource.total_quantity }}" min="1"
                       class="w-full rounded-xl border border-brand-border px-4 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none bg-brand-surface text-white">
            </div>
            <div class="space-y-1.5">
                <label class="block text-sm font-semibold text-gray-600">Description</label>
                <textarea name="description" rows="3"
                          class="w-full rounded-xl border border-brand-border px-4 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none bg-brand-surface text-white resize-none">{{ resource.description or '' }}</textarea>
            </div>
            <button type="submit"
                    class="w-full py-3 rounded-xl bg-emerald-600 text-white font-bold hover:bg-emerald-700 transition shadow-lg">
                Save Changes
            </button>
        </form>
    </div>
</div>
{% endblock %}
