{% extends 'layout.html' %}
{% block title %}Edit Resource — CECRMS{% endblock %}
{% block page_title %}Edit Resource{% endblock %}

{% block content %}
<div class="page-content anim-fade" style="max-width:640px;">

    <a href="{{ url_for('resources.list_resources') }}"
       class="inline-flex items-center gap-2 text-sm mb-6 transition-colors"
       style="color:var(--text-muted);">
        <i data-lucide="arrow-left" style="width:13px;height:13px;"></i>
        Back to Resources
    </a>

    <div class="card p-6">
        <h1 class="page-title mb-5" style="display:flex;align-items:center;gap:8px;">
            <i data-lucide="pencil" style="width:18px;height:18px;color:var(--amber);"></i>
            Edit Resource
        </h1>

        <form method="POST">
            <div class="form-group">
                <label class="form-label">Resource Name</label>
                <input name="resource_name" value="{{ resource.resource_name }}"
                       class="form-input" required>
            </div>

            <div class="form-group">
                <label class="form-label">Total Quantity</label>
                <input type="number" name="total_quantity" value="{{ resource.total_quantity }}"
                       min="1" class="form-input" required>
            </div>

            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea name="description" rows="3" class="form-input">{{ resource.description or '' }}</textarea>
            </div>

            <div class="flex gap-3">
                <button type="submit" class="btn btn-primary flex-1 justify-center">
                    <i data-lucide="save" style="width:14px;height:14px;"></i>
                    Save Changes
                </button>
                <a href="{{ url_for('resources.list_resources') }}" class="btn btn-secondary">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
