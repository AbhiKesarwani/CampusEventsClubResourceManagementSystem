{% extends 'layout.html' %}
{% block content %}

<h2 class="page-title text-center animate-fade-in">Create Event</h2>

<div class="bg-brand-surface border border-white/5 backdrop-blur-md soft-shadow-lg p-10 rounded-2xl max-w-3xl mx-auto animate-slide-up">

    <form method="POST" enctype="multipart/form-data" class="grid grid-cols-1 gap-7">

        <!-- SECTION: Basic Info -->
        <h3 class="text-xl font-bold text-gray-100">Event Details</h3>

        <!-- Club -->
        <div class="space-y-2">
            <label class="font-semibold text-gray-600">Select Club</label>
            <select name="club_id" class="input-box">
                {% for c in clubs %}
                <option value="{{ c.club_id }}">{{ c.club_name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Images -->
        <div class="space-y-2">
            <label class="font-semibold text-gray-600">Event Images</label>

            <label class="flex flex-col items-center justify-center border-2 border-dashed border-brand-border 
                           rounded-xl py-6 cursor-pointer bg-brand-surface text-white/40 hover:bg-brand-surface text-white/60 transition">

                <span class="text-gray-500">Click to upload images</span>
                <input type="file" name="event_images" multiple accept="image/*" class="hidden" id="uploadInput">

            </label>

            <p class="text-xs text-gray-500">You can upload multiple photos.</p>
        </div>

        <!-- Title -->
        <div class="space-y-2">
            <label class="font-semibold text-gray-600">Event Title</label>
            <input name="title" class="input-box" placeholder="Enter event name">
        </div>

        <!-- Description -->
        <div class="space-y-2">
            <label class="font-semibold text-gray-600">Description</label>
            <textarea name="description" class="input-box h-32" placeholder="Short event description"></textarea>
        </div>

        <!-- Event Lead -->
        <div class="space-y-2">
            <label class="font-semibold text-gray-600">Event Lead</label>
            <input name="event_lead" class="input-box" placeholder="Lead name">
        </div>

        <!-- Contact -->
        <div class="space-y-2">
            <label class="font-semibold text-gray-600">Contact Number</label>
            <input name="contact_no" class="input-box" placeholder="Phone number">
        </div>

        <!-- SECTION: Scheduling -->
        <h3 class="text-xl font-bold text-gray-100 pt-4">Schedule & Venue</h3>

        <!-- Venue -->
        <div class="space-y-2">
            <label class="font-semibold text-gray-600">Select Venue</label>
            <select name="venue_id" class="input-box">
                {% for v in venues %}
                <option value="{{ v.venue_id }}">{{ v.venue_name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Date -->
        <div class="space-y-2">
            <label class="font-semibold text-gray-600">Date</label>
            <input type="date" name="date" class="input-box">
        </div>

        <!-- Time -->
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="font-semibold text-gray-600">Start Time</label>
                <input type="time" name="start_time" class="input-box">
            </div>

            <div>
                <label class="font-semibold text-gray-600">End Time</label>
                <input type="time" name="end_time" class="input-box">
            </div>
        </div>

        <!-- Registration Link -->
        <div class="space-y-2">
            <label class="font-semibold text-gray-600">Google Form Link</label>
            <input name="registration_link" class="input-box" placeholder="Paste registration link">
        </div>

        <!-- SECTION: Resources -->
        <h3 class="text-xl font-bold text-gray-100 pt-4">Resources Required</h3>

        <div class="space-y-3">
            {% for r in resources %}
            <div class="flex items-center gap-3 bg-brand-surface text-white/50 px-4 py-3 rounded-xl soft-shadow transition
                        hover:scale-[1.01] hover:bg-brand-surface text-white/80">

                <input type="checkbox" name="resource_id" value="{{ r.resource_id }}"
                       class="h-4 w-4 rounded border-gray-400">

                <span class="text-gray-100">
                    {{ r.resource_name }}
                    <span class="text-gray-500 text-sm">(Available: {{ r.total_quantity }})</span>
                </span>

                <input type="number" min="1"
                       name="quantity_{{ r.resource_id }}"
                       placeholder="Qty"
                       class="ml-auto w-24 p-2 border rounded-lg">
            </div>
            {% endfor %}
        </div>

        <!-- Submit Button -->
        <button class="btn-primary w-full py-3 mt-4 shadow-lg hover:shadow-xl transition">
            Create Event
        </button>

    </form>
</div>

<!-- JS to make label clickable -->
<script>
document.querySelector("label[for='uploadInput']");
</script>

{% endblock %}
