<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 — Page Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>* { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-50 to-blue-100 flex items-center justify-center p-6">
    <div class="text-center max-w-lg">
        <div class="text-9xl font-black text-indigo-200 mb-4 select-none">404</div>
        <i data-lucide="file-question" class="w-20 h-20 text-indigo-400 mx-auto mb-6"></i>
        <h1 class="text-2xl font-extrabold text-gray-100 mb-2">Page Not Found</h1>
        <p class="text-gray-500 text-sm mb-8">The page you're looking for doesn't exist or has been moved.</p>
        <a href="/" class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-emerald-600 text-white font-semibold hover:bg-emerald-700 transition shadow-lg">
            <i data-lucide="home" class="w-4 h-4"></i> Go Home
        </a>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
