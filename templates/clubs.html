{% extends 'layout.html' %}
{% block content %}

<h2 class="page-title text-center mb-8">Clubs</h2>

<!-- Add Club Button -->
<div class="flex justify-end mb-6">
    <a href="/clubs/create" class="btn-primary">
        + Create Club
    </a>
</div>

<!-- CLUB GRID -->
<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-7">

    {% for c in clubs %}
    <div class="glass soft-shadow-lg rounded-2xl overflow-hidden hover:scale-[1.02] transition">

        <!-- Club Image -->
        {% if c.first_image %}
        <img src="/static/{{ c.first_image }}" 
             class="rounded-img h-48 w-full object-cover">
        {% else %}
        <div class="h-48 w-full bg-gray-200 flex items-center justify-center text-gray-500 text-sm">
            No Image
        </div>
        {% endif %}

        <!-- Content -->
        <div class="p-6">

            <h3 class="card-title">{{ c.club_name }}</h3>

            <p class="card-sub mt-1 h-16 overflow-hidden">
                {{ c.description or "No description provided." }}
            </p>

            <!-- Buttons -->
            <div class="flex gap-3 mt-6">

                <a href="/clubs/{{ c.club_id }}" 
                   class="btn-primary text-sm px-4 py-2">
                   View
                </a>

                <a href="/clubs/{{ c.club_id }}/edit"
                   class="px-4 py-2 rounded-xl bg-yellow-500 text-white hover:bg-yellow-600 text-sm soft-shadow">
                   Edit
                </a>

                <form method="POST" action="/clubs/{{ c.club_id }}/delete"
                      onsubmit="return confirm('Delete this club?');">
                    <button class="btn-danger text-sm px-4 py-2">
                        Delete
                    </button>
                </form>

            </div>

        </div>
    </div>
    {% endfor %}

</div>

{% endblock %}
