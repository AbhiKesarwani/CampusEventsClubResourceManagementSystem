<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register – CECRMS</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: linear-gradient(135deg, #e0f2fe, #f5eaff);
            font-family: "Inter", sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(14px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.3);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <div class="glass-card p-10 w-full max-w-lg shadow-2xl animate-fadeIn">

        <h2 class="text-3xl font-extrabold text-center bg-gradient-to-r from-blue-500 to-purple-600 text-transparent bg-clip-text mb-6">
            Create an Account
        </h2>

        {% if error %}
        <p class="text-red-500 text-center mb-4">{{ error }}</p>
        {% endif %}

        <form method="POST" class="space-y-5">

            <div>
                <label class="text-gray-700 font-semibold">Full Name</label>
                <input type="text" name="name" required
                       class="w-full p-3 rounded-xl border outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-300 transition">
            </div>

            <div>
                <label class="text-gray-700 font-semibold">Email</label>
                <input type="email" name="email" required
                       class="w-full p-3 rounded-xl border outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-300 transition">
            </div>

            <div>
                <label class="text-gray-700 font-semibold">Password</label>
                <input type="password" name="password" required
                       class="w-full p-3 rounded-xl border outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-300 transition">
            </div>

            <div>
                <label class="text-gray-700 font-semibold">Confirm Password</label>
                <input type="password" name="confirm_password" required
                       class="w-full p-3 rounded-xl border outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-300 transition">
            </div>

            <button class="w-full py-3 mt-4 rounded-xl font-semibold text-white text-lg 
                           bg-gradient-to-r from-blue-600 to-purple-600 
                           hover:opacity-90 transition">
                Register
            </button>

        </form>

        <p class="mt-6 text-center text-gray-700">
            Already have an account?
            <a href="/login" class="text-blue-600 font-semibold hover:underline">Login</a>
        </p>

    </div>

</body>
</html>
