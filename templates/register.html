<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — CECRMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        * { font-family: 'Inter', sans-serif; margin: 0; }

        :root {
            --bg: #0d1117;
            --bg-2: #161b22;
            --border: rgba(48,61,78,0.8);
            --text: #e6edf3;
            --text-muted: #8d96a0;
            --emerald: #10b981;
            --emerald-dim: rgba(16,185,129,0.12);
            --red: #ef4444;
        }

        body {
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 36px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .logo-wrap {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            width: 52px; height: 52px;
            border-radius: 14px;
            background: linear-gradient(135deg, #10b981, #059669);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            box-shadow: 0 6px 24px rgba(16,185,129,0.35);
        }

        h1 { font-size: 1.5rem; font-weight: 800; color: var(--text); line-height: 1.2; }
        .subtitle { font-size: 0.8rem; color: var(--text-muted); margin-top: 3px; }

        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 0.77rem; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; }
        .input-wrap { position: relative; }
        .input-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--text-muted); pointer-events: none; }
        input, select {
            width: 100%;
            padding: 10px 12px 10px 36px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.83rem;
            outline: none;
            transition: border-color 0.2s;
        }
        select { padding-left: 12px; }
        input:focus, select:focus { border-color: var(--emerald); }
        input::placeholder { color: var(--text-muted); opacity: 0.7; }

        .btn {
            width: 100%;
            padding: 11px;
            background: var(--emerald);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 6px;
        }
        .btn:hover { background: #059669; }
        .btn:active { transform: scale(0.98); }

        .alert {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 16px;
        }
        .alert-danger  { background: rgba(239,68,68,0.1);  border: 1px solid rgba(239,68,68,0.25);  color: #fca5a5; }
        .alert-success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.25); color: #6ee7b7; }
        .alert-info    { background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.25); color: #93c5fd; }

        .footer-link { text-align: center; margin-top: 18px; font-size: 0.78rem; color: var(--text-muted); }
        .footer-link a { color: var(--emerald); text-decoration: none; font-weight: 600; }
        .footer-link a:hover { text-decoration: underline; }

        .pw-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 2px; }
    </style>
</head>
<body>
    <div class="card">

        <div class="logo-wrap">
            <div class="logo-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                     fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
                </svg>
            </div>
            <h1>CECRMS</h1>
            <p class="subtitle">Create Your Account</p>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }}">{{ msg }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.register') }}">

            <div class="form-group">
                <label for="reg-name">Full Name <span style="color:var(--red);">*</span></label>
                <div class="input-wrap">
                    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <input type="text" id="reg-name" name="name" required placeholder="Your full name" autocomplete="name">
                </div>
            </div>

            <div class="form-group">
                <label for="reg-email">Email <span style="color:var(--red);">*</span></label>
                <div class="input-wrap">
                    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                    <input type="email" id="reg-email" name="email" required placeholder="you@college.edu" autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <label for="reg-phone">Phone</label>
                <div class="input-wrap">
                    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.73 12 19.79 19.79 0 0 1 1.71 3.35 2 2 0 0 1 3.69 1h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9c1.91 3.27 4.74 6.1 8 8l1.36-1.36a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                    <input type="tel" id="reg-phone" name="phone" placeholder="+91 99999 99999" autocomplete="tel">
                </div>
            </div>

            <div class="form-group">
                <label for="reg-club">Club (optional)</label>
                <select id="reg-club" name="club_id">
                    <option value="">— No club —</option>
                    {% for c in clubs %}
                    <option value="{{ c.club_id }}">{{ c.club_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="reg-password">Password <span style="color:var(--red);">*</span></label>
                <div class="input-wrap">
                    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    <input type="password" id="reg-password" name="password" required
                           placeholder="Min 6 characters" autocomplete="new-password">
                    <button type="button" class="pw-toggle" onclick="togglePw()" id="pw-toggle-btn">
                        <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="15" height="15"
                             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn">Create Account →</button>

        </form>

        <p class="footer-link">
            Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
        </p>
    </div>

    <script>
        lucide.createIcons();
        function togglePw() {
            const input = document.getElementById('reg-password');
            input.type = input.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>
