{% extends "layout.html" %}
{% block content %}

<h2 class="page-title text-center">Resources</h2>

<!-- Add Resource Button -->
<div class="flex justify-end mb-6">
    <a href="/resources/create" class="btn-primary">
        + Add Resource
    </a>
</div>

<!-- Resources Table -->
<div class="glass soft-shadow-lg rounded-2xl p-6 overflow-x-auto backdrop-blur">

    <table class="modern-table w-full">
        <thead>
            <tr>
                <th>Resource</th>
                <th>Total Quantity</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            {% for r in resources %}
            <tr class="hover-row">
                <td class="font-semibold">{{ r.resource_name }}</td>
                <td class="text-gray-700">{{ r.total_quantity }}</td>
                <td class="text-gray-600 text-sm max-w-sm">
                    {{ r.description if r.description else "—" }}
                </td>
                <td class="flex gap-3 py-2">

                    <a href="/resources/{{ r.resource_id }}/edit"
                       class="px-4 py-2 rounded-xl bg-yellow-500 text-white text-sm hover:bg-yellow-600 soft-shadow">
                        Edit
                    </a>

                    <form action="/resources/{{ r.resource_id }}/delete"
                          method="POST"
                          onsubmit="return confirm('Are you sure you want to delete this resource?');">
                        <button class="btn-danger text-sm px-4 py-2">
                            Delete
                        </button>
                    </form>

                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>

{% endblock %}
