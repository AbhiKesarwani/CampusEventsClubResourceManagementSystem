{% extends 'layout.html' %}
{% block content %}

<h2 class="page-title text-center mb-8">Create Club</h2>

<div class="glass soft-shadow-lg p-8 rounded-2xl max-w-2xl mx-auto">

    <form method="POST" enctype="multipart/form-data" class="grid gap-6">

        <!-- Club Name -->
        <div>
            <label class="font-semibold text-gray-700">Club Name</label>
            <input name="club_name" class="input-box" placeholder="Enter club name">
        </div>

        <!-- Club Images -->
        <div>
            <label class="font-semibold text-gray-700">Club Images</label>

            <div class="bg-white/40 border rounded-xl p-4">
                <input type="file" 
                       name="club_images" 
                       multiple 
                       accept="image/*"
                       class="w-full p-2 text-sm">

                <p class="text-xs text-gray-500 mt-1">
                    You can upload multiple images for the club gallery.
                </p>
            </div>
        </div>

        <!-- Description -->
        <div>
            <label class="font-semibold text-gray-700">Description</label>
            <textarea name="description" 
                      class="input-box h-32" 
                      placeholder="Write a short description about the club..."></textarea>
        </div>

        <!-- Submit -->
        <button class="btn-primary w-full text-center py-3 mt-2">
            Create Club
        </button>

    </form>

</div>

{% endblock %}
