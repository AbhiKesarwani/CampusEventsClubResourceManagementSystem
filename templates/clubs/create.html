{% extends 'layout.html' %}
{% block title %}Create Club — CECRMS{% endblock %}
{% block page_title %}Create Club{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <nav class="text-sm text-gray-500 mb-6 flex items-center gap-2">
        <a href="{{ url_for('clubs.list_clubs') }}" class="hover:text-indigo-600">Clubs</a>
        <i data-lucide="chevron-right" class="w-4 h-4"></i>
        <span class="text-gray-800 font-medium">Create Club</span>
    </nav>

    <div class="glass rounded-2xl p-8 shadow-lg">
        <h2 class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-2">
            <i data-lucide="shield-plus" class="w-5 h-5 text-indigo-600"></i> New Club
        </h2>

        <form method="POST" enctype="multipart/form-data" class="space-y-5">

            <div class="space-y-1.5">
                <label class="block text-sm font-semibold text-gray-700">Club Name <span class="text-red-500">*</span></label>
                <input name="club_name" required placeholder="e.g. Coding Club"
                       class="w-full rounded-xl border border-gray-200 px-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-300 outline-none bg-white">
            </div>

            <div class="space-y-1.5">
                <label class="block text-sm font-semibold text-gray-700">Description</label>
                <textarea name="description" rows="4" placeholder="Describe the club…"
                          class="w-full rounded-xl border border-gray-200 px-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-300 outline-none bg-white resize-none"></textarea>
            </div>

            <div class="space-y-1.5">
                <label class="block text-sm font-semibold text-gray-700">Coordinator</label>
                <select name="coordinator_id" class="w-full rounded-xl border border-gray-200 px-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-300 outline-none bg-white">
                    <option value="">No coordinator</option>
                    {% for u in users %}
                    <option value="{{ u.user_id }}">{{ u.name }} ({{ u.role }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="space-y-1.5">
                <label class="block text-sm font-semibold text-gray-700">
                    Club Admin Email
                    <span class="text-xs font-normal text-gray-400 ml-1">(ownership — club_admin with this email can manage the club)</span>
                </label>
                <input name="club_email" type="email" placeholder="e.g. aaghaz@gmail.com"
                       class="w-full rounded-xl border border-gray-200 px-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-300 outline-none bg-white">
            </div>

            <div class="space-y-1.5">
                <label class="block text-sm font-semibold text-gray-700">Club Images</label>
                <label class="flex flex-col items-center justify-center border-2 border-dashed border-indigo-200 rounded-xl py-8 cursor-pointer bg-indigo-50/50 hover:bg-indigo-50 transition">
                    <i data-lucide="upload-cloud" class="w-10 h-10 text-indigo-400 mb-2"></i>
                    <span class="text-sm text-indigo-600 font-medium">Click to upload</span>
                    <span class="text-xs text-gray-400 mt-1">Max 5 MB each</span>
                    <input type="file" name="club_images" multiple accept=".jpg,.jpeg,.png,.gif,.webp" class="hidden">
                </label>
            </div>

            <button type="submit"
                    class="w-full py-3 rounded-xl bg-indigo-600 text-white font-bold hover:bg-indigo-700 transition shadow-lg">
                Create Club
            </button>
        </form>
    </div>
</div>
{% endblock %}
