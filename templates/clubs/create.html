{% extends 'layout.html' %}
{% block title %}Create Club — CECRMS{% endblock %}
{% block page_title %}Create Club{% endblock %}

{% block content %}
<div class="page-content anim-fade" style="max-width:720px;">

    <a href="{{ url_for('clubs.list_clubs') }}"
       class="inline-flex items-center gap-2 text-sm mb-6 transition-colors"
       style="color:var(--text-muted);">
        <i data-lucide="arrow-left" style="width:13px;height:13px;"></i>
        Back to Clubs
    </a>

    <div class="card p-6">
        <h1 class="page-title mb-5" style="display:flex;align-items:center;gap:8px;">
            <i data-lucide="shield-plus" style="width:18px;height:18px;color:var(--emerald);"></i>
            New Club
        </h1>

        <form method="POST" enctype="multipart/form-data">

            <div class="form-group">
                <label class="form-label">Club Name <span style="color:var(--red);">*</span></label>
                <input name="club_name" required placeholder="e.g. Coding Club"
                       class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea name="description" rows="4" placeholder="Describe the club…"
                          class="form-input"></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Coordinator</label>
                <select name="coordinator_id" class="form-input">
                    <option value="">No coordinator</option>
                    {% for u in users %}
                    <option value="{{ u.user_id }}">{{ u.name }} ({{ u.role }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">
                    Club Admin Email
                    <span style="font-size:0.7rem;font-weight:400;color:var(--text-subtle);margin-left:4px;">
                        — club_admin users with this email will manage this club
                    </span>
                </label>
                <input name="club_email" type="email" placeholder="e.g. coordinator@example.com"
                       class="form-input">
            </div>

            <!-- File Upload -->
            <div class="form-group">
                <label class="form-label">Club Images</label>
                <label class="upload-zone" style="cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px;border-radius:var(--radius-lg);border:2px dashed var(--border);background:var(--bg-hover);transition:border-color 0.2s;"
                       id="upload-label">
                    <i data-lucide="upload-cloud" style="width:28px;height:28px;color:var(--emerald);"></i>
                    <span style="font-size:0.83rem;font-weight:600;color:var(--emerald);">Click to upload images</span>
                    <span style="font-size:0.72rem;color:var(--text-subtle);">JPG, PNG, GIF, WEBP — max 5 MB each</span>
                    <input type="file" name="club_images" multiple accept=".jpg,.jpeg,.png,.gif,.webp"
                           class="hidden" id="image-input" onchange="updateLabel(this)">
                </label>
                <p class="form-hint" id="file-count"></p>
            </div>

            <div class="flex gap-3">
                <button type="submit" class="btn btn-primary flex-1 justify-center">
                    <i data-lucide="plus" style="width:14px;height:14px;"></i>
                    Create Club
                </button>
                <a href="{{ url_for('clubs.list_clubs') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function updateLabel(input) {
    const count = input.files.length;
    const label = document.getElementById('file-count');
    if (label) label.textContent = count ? `${count} file${count !== 1 ? 's' : ''} selected` : '';
    const zone = document.getElementById('upload-label');
    if (zone) zone.style.borderColor = count ? 'var(--emerald)' : 'var(--border)';
}
</script>
{% endblock %}
