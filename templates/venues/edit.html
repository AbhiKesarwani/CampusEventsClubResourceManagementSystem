{% extends 'layout.html' %}
{% block title %}Edit Venue — CampusOps{% endblock %}
{% block page_title %}Edit Venue{% endblock %}

{% block content %}
<div class="page-content anim-fade" style="max-width:640px;">

    <a href="{{ url_for('venues.list_venues') }}"
       class="inline-flex items-center gap-2 text-sm mb-6 transition-colors"
       style="color:var(--text-muted);">
        <i data-lucide="arrow-left" style="width:13px;height:13px;"></i>
        Back to Venues
    </a>

    <div class="card p-6">
        <h1 class="page-title mb-5" style="display:flex;align-items:center;gap:8px;">
            <i data-lucide="pencil" style="width:18px;height:18px;color:var(--amber);"></i>
            Edit — {{ venue.venue_name }}
        </h1>

        <form method="POST">
            <div class="form-group">
                <label class="form-label">Venue Name</label>
                <input name="venue_name" value="{{ venue.venue_name }}"
                       class="form-input" required>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">
                <div class="form-group" style="margin-bottom:0;">
                    <label class="form-label">Capacity</label>
                    <input type="number" name="capacity" value="{{ venue.capacity or '' }}"
                           class="form-input">
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label class="form-label">Type</label>
                    <input name="type" value="{{ venue.type or '' }}"
                           class="form-input" placeholder="Auditorium / Lab / Hall">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Location</label>
                <input name="location" value="{{ venue.location or '' }}"
                       class="form-input">
            </div>

            <div class="flex gap-3">
                <button type="submit" class="btn btn-primary flex-1 justify-center">
                    <i data-lucide="save" style="width:14px;height:14px;"></i>
                    Save Changes
                </button>
                <a href="{{ url_for('venues.list_venues') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
